name: Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Skip draft pull requests, and allow pushes to skip CI.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build

  playwright-version:
    name: Detect Playwright version
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      # Dependabot doesn't update job container images, so read the locked
      # Playwright version and use the matching image instead of pinning it.
      - name: Read Playwright version from package-lock.json
        id: version
        run: |
          version="$(jq -r '.packages["node_modules/playwright"].version // empty' package-lock.json)"
          if [[ -z "$version" ]]; then
            echo '::error::Playwright is missing from package-lock.json.'
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-browser:
    name: Chromium
    runs-on: ubuntu-latest
    needs: playwright-version
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    timeout-minutes: 15
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7
